en at the table."}, {"name": "Attack on Goldenfields tracker", "helps": "Tracks the three inside gangs, outside force, alarm/bell state, huckers, surrendered giants, and objectives."}, {"name": "Party prep and rules audit", "helps": "Keeps level 4 sheet issues, spell prep, Rillix, Kella rebuild, Potion of Heroism and travel questions in one place."}], "flow": [{"step": "Now", "detail": "Finish Rillix scene at Nightstone; settle Potion of Heroism; resolve Alfie/Kella rulesets."}, {"step": "Morak quest accepted", "detail": "Goldenfields selected: deliver news of Lathan and Melantha Xelbrin to Miros; bring Rillix if alive."}, {"step": "Next day", "detail": "Tower of Zephyros appears and offers transport toward the chosen destination."}, {"step": "Arrival", "detail": "Goldenfields: a huge walled temple-farm dedicated to Chauntea, crucial food source for the North and linked to the Emerald Enclave."}, {"step": "Likely stay", "detail": "Visitors are directed to Northfurrow’s End; this is also where several special NPCs begin."}, {"step": "Main event", "detail": "Night attack: infiltrating goblinoid/ogre gangs inside, larger giant force outside, alarm/bell changes the encounter shape."}, {"step": "Aftermath", "detail": "Surviving special NPCs can offer follow-up quests that branch into wider Chapter 3 travel."}], "goldenfields": {"summary": "A vast walled temple-farm called the Granary of the North: Chauntea worship, Emerald Enclave presence, heavy agriculture, many workers, strong walls but imperfect vigilance.", "playerSafe": ["Expect a living agricultural holy site, not just a town.", "Miros Xelbrin at Northfurrow’s End is the party’s emotional contact.", "Rillix the tressym should be treated as a grief-token and family companion, not loot.", "Emerald Enclave and Chauntea clergy matter socially.", "Food security in the North is a campaign-scale issue."], "locations": [["G1 Gatehouse", "Fortified entry, searches visitors, politically appointed castellan; strong doors and many defenders."], ["G2 Watch Posts", "Wall pagodas, gongs audible over long distance, scouts/guards; alarm network is vital."], ["G3 Earth Mother’s Bounty", "Seed/cornucopia store run by Emerald Enclave druid; good social contact."], ["G4 Grain Towers", "Food storage; possible threat/target during attack."], ["G5 Livestock Fields", "Animal pens; Shalvus starts here in source but often drifts to the inn."], ["G6 Town", "Longhouses, central plaza, Lifferlas the awakened tree."], ["G7 Abbey", "Chauntea abbey, Abbot Ellardin Darovik, Zi Liang; bell/alarm importance."], ["G8 Northfurrow’s End", "Huge inn. Miros, Naxene, Oren and Shalvus are relevant here."], ["G9 Goldengulp Brewery", "Brewery and Dragon’s Spire guard headquarters; Strog Thunderblade is captain."], ["G10 Freshwater Spring", "Watercourse and bridges; useful movement/terrain note."], ["G11 Rice Paddies", "Wet terrain; possible difficult movement."], ["G12 Vegetable Gardens", "Large garden tracts; cover/visibility considerations."], ["G13 Wheat Fields", "Where infiltrators enter; tall crops can hide movement."], ["G14 Herb Gardens", "Druid cottages and Chauntea growers."], ["G15 Orange Orchard", "Orchard terrain."], ["G16 Apple Orchard", "Beloved orchard with young treants nearby."], ["G17 Corn Field", "Tall corn late season; line-of-sight issue."], ["G18 Barley Field", "Goldengulp supply / cover."], ["G19 Hops Field", "Brewery supply / workers nearby."], ["G20 Pumpkin Patch", "Large pumpkins and worker house; open-field target."]]}, "specialNPCs": [{"name": "Shalvus Martholio", "start": "G8 / originally linked to livestock fields", "role": "Shepherd, Zhentarim spy", "playerHook": "Best for Naomi/Kella contrast: another Black Network operator with a different style.", "combatUse": "Light ranged/skirmish support; social risk more important than raw damage.", "partyNote": "Do not assume ally. He can become a contact, complication or mirror for Kella."}, {"name": "Lifferlas", "start": "G6 town", "role": "Awakened tree, protector of Goldenfields", "playerHook": "Great for Ben/Dorrin if he wants protective, gentle strength.", "combatUse": "Huge body, strong melee, vulnerable to fire; protects children and residents.", "partyNote": "Emotionally fits Wren/Dorrin. Could anchor defence of civilians."}, {"name": "Zi Liang", "start": "G7 abbey", "role": "Acolyte of Chauntea, disciplined wall-patroller", "playerHook": "Good for Josh/Talia if they like precise movement and principled courage.", "combatUse": "Mobile, observant, good at getting to the right place early.", "partyNote": "She already distrusts weak security; she may respect competence quickly."}, {"name": "Miros Xelbrin", "start": "G8 Northfurrow’s End", "role": "Innkeeper, grieving son, party’s quest contact", "playerHook": "Best for Talia/Wren: grief, hospitality, Rillix connection.", "combatUse": "Not a frontliner; protect him.", "partyNote": "Core emotional reason the party came to Goldenfields."}, {"name": "Naxene Drathkala", "start": "G8 stable house", "role": "Mage, Watchful Order of Magists and Protectors", "playerHook": "Best for Josh/Alfie: wizard-to-wizard strategic argument.", "combatUse": "Arcane support; also carries strong opinions about dragons/giants.", "partyNote": "Useful but potentially overconfident; she pushes bigger-world solutions."}, {"name": "Oren Yogilvy", "start": "G8 outside inn", "role": "Halfling musician who raises the alarm", "playerHook": "Best for Talia/Wren, comedy plus courage.", "combatUse": "Initial alarm is key; his lungs matter more than blade work.", "partyNote": "Do not ignore the alarm-caller; he starts the defence moving."}], "attack": {"summary": "Goldenfields is attacked by Guh’s raiding force. The encounter has inside infiltrators, an outside force, alarm/bell escalation, and special NPCs who can be assigned to players.", "initialForces": [["Hill giants", "6 total including Lob and Ogg; some remain outside initially."], ["Ogres", "12 total; 6 have goblin huckers outside."], ["Bugbears", "12 total; all go over the wall."], ["Goblins", "60 total; half inside, half outside with huckers."]], "insideGangs": [["Moon Biters", "2 ogres, 4 bugbears, 10 goblins", "Head toward livestock pens G5."], ["Eye Stabbers", "2 ogres, 4 bugbears, 10 goblins", "Head toward town G6; Oren spots them."], ["Hill Howlers", "2 ogres, 4 bugbears, 10 goblins", "Get lost near grain towers G4, then head toward abbey G7."]], "outsideForce": [["Outside pressure", "4 hill giants, 6 hucker-ogres, 30 goblins", "Threaten walls from outside; huckers throw goblins/rocks/pitch-like payloads."], ["Lob and Ogg", "2 hill giants", "Later climb in unarmed and head toward abbey; can surrender if badly hurt."]], "objectives": ["Wake the party and identify attack direction.", "Protect Miros/Rillix and civilians near Northfurrow’s End.", "Get someone to ring or coordinate the abbey/watch-post alarm fast.", "Stop/redirect the Eye Stabbers in town before civilians are overrun.", "Send fast help toward G7 abbey and G5 livestock fields.", "Keep giants away from clustered civilians; use space, walls, trees, and fields.", "Capture/interrogate Lob or Ogg if possible for clues about Guh / Grudd Haug."], "bells": "If the abbey bell/gongs ring, it panics invaders inside and alerts the compound; the encounter changes from surprise to organised defence.", "huckers": "Goblin huckers are ogre-mounted trebuchet contraptions. They can lob goblins or other projectiles over distance/cover; tracking them separately prevents nasty surprises."}, "sourceRefs": [["Chapter 2 structure", "Chapter 2 starts at p.37 and includes Special NPCs, Bryn Shander, Goldenfields, Triboar, and Chapter 2 advancement."], ["Morak to Goldenfields", "Morak’s Goldenfields quest sends the party to Miros Xelbrin and Rillix if alive."], ["Goldenfields overview", "Goldenfields is a massive Chauntean temple-farm / Emerald Enclave base and key food source."], ["Attack structure", "Guh’s raiders include hill giants, ogres, bugbears and goblins, split inside/outside the walls."], ["Special NPC quests", "Surviving Goldenfields special NPCs can branch the party into further Chapter 3 travel."]]}}</script>
  <script>
  const DATA = JSON.parse(document.getElementById('app-data').textContent);
  let currentView='dashboard';
  const VIEWS=[['dashboard','📌 Dashboard'],['scene','🐱 Current Scene'],['chapter2','🌾 Ch.2 Prep'],['goldenfields','🏰 Goldenfields'],['npcassign','🎭 NPC Cards'],['defence','⚔️ Defence Tracker'],['ruleset','✅ Rules & Prep'],['party','👥 Party'],['inventory','🎒 Inventory'],['quests','🧭 Quests'],['timeline','🕰️ Timeline'],['npcs','🧩 NPCs'],['documents','📚 Documents']];
  function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
  function nav(){document.getElementById('nav').innerHTML=VIEWS.map(([id,label])=>`<button class="${id===currentView?'active':''}" onclick="show('${id}')">${label}</button>`).join('')}
  function show(id){currentView=id; nav(); render(); if(innerWidth<900) toggleSidebar(false)}
  function toggleSidebar(force){const s=document.getElementById('sidebar'); if(force===false)s.classList.remove('open'); else s.classList.toggle('open')}
  function toggleTheme(){document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark'}
  function adjustFont(delta){const root=document.documentElement; const cur=parseInt(getComputedStyle(root).getPropertyValue('--font-size'))||17; root.style.setProperty('--font-size',Math.max(13,Math.min(24,cur+delta))+'px')}
  function hero(title,subtitle){return `<div class="hero"><h2>${title}</h2><p>${subtitle}</p><div class="hero-grid"><div class="stat"><b>${esc(DATA.state.location)}</b><span>Current location</span></div><div class="stat"><b>Level 4</b><span>Post-Dripping Caves milestone</span></div><div class="stat"><b>Goldenfields</b><span>Chosen sourcebook quest</span></div><div class="stat"><b>Rillix</b><span>Immediate objective</span></div></div><div class="warning"><strong>Rules check:</strong> ${esc(DATA.state.rulesWarning)}</div></div>`}
  function dashboard(){return hero(DATA.state.bookmark,DATA.state.scene)+`<div class="grid"><div class="card wide"><h3>Best next move</h3><p>${esc(DATA.state.bestNextMove)}</p></div><div class="card"><h3>Active quest</h3><p>${esc(DATA.state.quest)}</p></div><div class="card"><h3>Next source beat</h3><p>${esc(DATA.state.nextBeat)}</p></div><div class="card"><h3>Party terms for Kella</h3><p>No party theft, no PvP, no secret Zhentarim messages, no selling party routes/plans. Shared goals and shared resources with records.</p></div><div class="card full"><h3>Session checklist</h3><div class="chips"><span class="chip">Resolve Alfie ruleset before combat</span><span class="chip">Coax Rillix</span><span class="chip">Confirm Potion of Heroism status</span><span class="chip">Prepare Goldenfields travel</span><span class="chip">Tower of Zephyros next day</span></div></div></div>`}
  function scene(){return hero('Current scene: Rillix at Area 4H','The party is at the ruined Xelbrin cottage. Rillix is alive but frightened and suspicious.')+`<div class="grid"><div class="card wide"><h3>Recommended declaration</h3><p><strong>Alfie</strong> crouches low outside the broken cottage, softens a strip of dried beef with a little water, and places it on clean stone where Rillix can see it. He does not reach toward the tressym.</p><p>“Wren, I think he needs your voice more than mine.”</p></div><div class="card"><h3>Best bait</h3><p>${esc(DATA.inventory.rillixBait)}</p></div><div class="card"><h3>Roles</h3><p><strong>Wren:</strong> lead the voice/Animal Handling. <strong>Dorrin:</strong> stay still. <strong>Kella:</strong> watch exits but don’t corner. <strong>Alfie:</strong> assist gently.</p></div><div class="card full"><h3>Rillix details</h3><p>Ash-grey tressym with darker stripes, feathered wings, and green-gold eyes. The goal is not to catch him violently; it is to make him willing to come with the party to Miros Xelbrin.</p></div></div>`}
  
  function chapter2(){const c=DATA.chapter2;return hero('Chapter 2 prep: Rumblings','Version 3 adds player-safe planning tools and spoiler-toggle DM aids for Goldenfields, without copying long PDF text.')+`<div class="grid"><div class="card wide good-card"><h3>How much Chapter 2 can go into the site?</h3><p>${esc(c.howMuch)}</p><p class="mini">${esc(c.copyrightNote)}</p></div><div class="card"><h3>Source flow</h3><div class="timeline">${c.flow.map(x=>`<div class="tl"><b>${esc(x.step)}</b><span>${esc(x.detail)}</span></div>`).join('')}</div></div><div class="card full"><h3>5 new V3 features</h3>${table(['Feature','Why it helps'],c.features.map(f=>[f.name,f.helps]))}</div><div class="card full"><h3>Source reference index</h3>${table(['Reference','Use at table'],c.sourceRefs)}</div></div>`}
  function goldenfields(){const g=DATA.chapter2.goldenfields;return hero('Goldenfields quick reference',g.summary)+`<div class="grid"><div class="card wide good-card"><h3>Player-safe briefing</h3><ul>${g.playerSafe.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card danger-card"><h3>DM spoiler guard</h3><p>Use the location index freely for orientation, but keep the attack tracker hidden until Marcus triggers the alarm.</p><button class="btn" onclick="show('defence')">Open Defence Tracker</button></div><div class="card full"><h3>Location index: G1–G20</h3>${table(['Area','Party-useful summary'],g.locations)}</div></div>`}
  function npcassign(){const npcs=DATA.chapter2.specialNPCs;return hero('Goldenfields special NPC cards','Chapter 2 gives player-controlled special NPCs during the defence. These cards help assign them quickly without overwhelming the table.')+`<div class="grid">${npcs.map(n=>`<div class="card"><h3>${esc(n.name)}</h3><p><span class="chip">${esc(n.role)}</span></p><p><strong>Starts:</strong> ${esc(n.start)}</p><p><strong>Player fit:</strong> ${esc(n.playerHook)}</p><p><strong>Combat use:</strong> ${esc(n.combatUse)}</p><p><strong>Party note:</strong> ${esc(n.partyNote)}</p></div>`).join('')}</div>`}
  function defence(){const a=DATA.chapter2.attack;return hero('Attack on Goldenfields tracker',a.summary)+`<div class="grid"><div class="card wide danger-card"><h3>DM-only warning</h3><p>This page contains structural spoilers for the Goldenfields attack. Use it when planning or once the alarm has sounded.</p><div class="toggle-row"><button class="btn" onclick="toggleObjectives()">Toggle completed objectives</button><button class="btn" onclick="ringBell()">Mark bell/gongs rung</button><span id="bellState" class="chip">Bell state: not marked</span></div></div><div class="card"><h3>Initial force</h3>${table(['Group','Summary'],a.initialForces)}</div><div class="card full"><h3>Inside gangs</h3>${table(['Gang','Composition','Direction'],a.insideGangs)}</div><div class="card full"><h3>Outside force</h3>${table(['Threat','Composition','Tactical note'],a.outsideForce)}</div><div class="card wide"><h3>Objectives</h3><ul id="objList">${a.objectives.map((x,i)=>`<li class="objective" onclick="this.classList.toggle('done')"><strong>${i+1}.</strong> ${esc(x)}</li>`).join('')}</ul></div><div class="card"><h3>Bells / alarms</h3><p>${esc(a.bells)}</p></div><div class="card"><h3>Goblin huckers</h3><p>${esc(a.huckers)}</p></div></div>`}
  function ruleset(){return hero('Rules and prep audit','Use this before the next combat so the table starts Chapter 2 cleanly.')+`<div class="grid"><div class="card danger-card"><h3>Alfie ruleset mismatch</h3><p>${esc(DATA.state.rulesWarning)}</p><ul><li>Pick one: 2014 Divination continuity or D&D Beyond 2024 Evocation sheet.</li><li>If using 2014: rebuild Alfie in D&D Beyond/manual sheet.</li><li>If using 2024: table should explicitly agree to switch rulesets.</li></ul></div><div class="card"><h3>Kella rebuild</h3><p>Naomi can run Kella using the Spy block for one session, then rebuild as a level 4 Rogue or agreed equivalent. Preserve party terms: no theft, no PvP, no secret betrayal arc.</p></div><div class="card"><h3>Before leaving Nightstone</h3><ul><li>Coax Rillix safely.</li><li>Confirm Potion of Heroism: return or formal loan.</li><li>Confirm 475 gp horse restitution remains logged.</li><li>Send/carry Roane relief letters.</li></ul></div><div class="card"><h3>Goldenfields arrival goals</h3><ul><li>Find Miros kindly.</li><li>Deliver Rillix with care.</li><li>Learn layout before sleeping.</li><li>Ask about guards, watch posts, bells/gongs, and recent giant reports in-character.</li></ul></div><div class="card full"><h3>Suggested player assignments if attack begins</h3>${table(['Player','Suggested special NPC','Why'],[['Josh / Alfie','Naxene or Zi Liang','Wizard strategy or disciplined wall-runner fits Josh’s tactical style.'],['Talia / Wren','Miros or Oren','Emotional/Rillix link or bardic alarm energy.'],['Ben / Dorrin','Lifferlas','Protector of children/residents fits Ben’s Dorrin instincts.'],['Naomi / Kella','Shalvus','Zhentarim mirror without forcing betrayal.']])}</div></div>`}

  function party(){return hero('Party roster','Current level 4 party and player-control notes.')+`<div class="grid">${DATA.party.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p><strong>Player:</strong> ${esc(p.player)}<br><strong>Role:</strong> ${esc(p.role)}<br><strong>Level:</strong> ${esc(p.level)}<br><strong>HP:</strong> ${esc(p.hp)}<br><strong>AC:</strong> ${esc(p.ac)}</p><p>${esc(p.status)}</p><ul>${p.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}</div>`}
  function inventory(){const inv=DATA.inventory; return hero('Inventory and supplies','Exact current wagon/person inventory from Bookmark 5.')+`<div class="grid"><div class="card"><h3>Coin</h3><p>${esc(inv.coin)}</p></div><div class="card wide"><h3>Cider</h3>${table(['Item','Qty','Status'],inv.cider.map(x=>[x.item,x.qty,x.status]))}</div><div class="card wide"><h3>Food</h3>${table(['Food','Amount'],inv.food)}</div><div class="card"><h3>Rillix bait</h3><p>${esc(inv.rillixBait)}</p></div><div class="card wide"><h3>Gear</h3>${table(['Item','Amount / note'],inv.gear)}</div><div class="card"><h3>Quest / trust-held items</h3><ul>${inv.questItems.map(([a,b])=>`<li><strong>${esc(a)}:</strong> ${esc(b)}</li>`).join('')}</ul></div></div>`}
  function quests(){return hero('Active quest: Goldenfields',DATA.state.quest)+`<div class="grid"><div class="card"><h3>Accepted source quest</h3><p>Goldenfields. Tell Miros Xelbrin that Lathan and Melantha died in Nightstone. Bring Rillix safely if alive.</p></div><div class="card"><h3>Why this quest</h3><p>The table preferred the heart/hearth route after Nightstone. Wren strongly wants to save the tressym.</p></div><div class="card"><h3>Tower of Zephyros</h3><p>Source-correct timing: the day after the characters accept Morak’s quest, Zephyros’s tower appears and offers transport.</p></div><div class="card full"><h3>Open obligations</h3><ul><li>475 gp remaining horse restitution to Nightstone.</li><li>Relief letters for timber, grain, bridge materials, and labour.</li><li>Resolve Potion of Heroism: return to Morak or formally borrow.</li><li>Rillix must be safely coaxed and transported.</li></ul></div></div>`}
  function timeline(){return hero('Campaign timeline','Major source and table-canon beats up to Bookmark 5.')+`<div class="card full"><div class="timeline">${DATA.timeline.map(([a,b])=>`<div class="tl"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div></div>`}
  function npcs(){return hero('NPC and faction status','Who matters now, and where they stand.')+`<div class="grid">${DATA.npcs.map(n=>`<div class="card"><h3>${esc(n.name)}</h3><p><strong>${esc(n.group)}</strong><br><span class="chip">${esc(n.stance)}</span></p><p>${esc(n.details)}</p></div>`).join('')}</div>`}
  function documents(){return hero('Embedded documents','All Markdown files from the ZIP are embedded here, so this works offline without browser file-fetch problems.')+`<div class="grid"><div class="card full"><h3>Documents</h3>${table(['Document','Path','Size'],DATA.docs.map(d=>[`<button class="btn" onclick="openDoc('${d.id}')">${esc(d.title)}</button>`,esc(d.path),d.sizeKB+' KB']))}</div><div class="card full" id="docReader"><p>Select a document above.</p></div></div>`}
  function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${String(c).startsWith('<')?c:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
  function render(){const map={dashboard,scene,chapter2,goldenfields,npcassign,defence,ruleset,party,inventory,quests,timeline,npcs,documents}; document.getElementById('view').innerHTML=map[currentView]()}
  function renderDocList(filter=''){const q=filter.toLowerCase(); const docs=DATA.docs.filter(d=>(d.title+d.path+d.content).toLowerCase().includes(q)); document.getElementById('docList').innerHTML=docs.map(d=>`<div class="doc-item" onclick="openDoc('${d.id}');show('documents')"><strong>${esc(d.title)}</strong><span>${esc(d.path)} · ${d.sizeKB} KB</span></div>`).join('')||'<p class="pill">No matches</p>'}
  document.getElementById('docSearch').addEventListener('input',e=>renderDocList(e.target.value));
  function openDoc(id){const d=DATA.docs.find(x=>x.id===id); if(!d)return; const target=document.getElementById('docReader'); if(!target){show('documents'); setTimeout(()=>openDoc(id),0); return} target.innerHTML=`<h3>${esc(d.title)}</h3><p class="chip">${esc(d.path)} · ${d.sizeKB} KB</p><div class="reader">${md(d.content)}</div>`; target.scrollIntoView({behavior:'smooth',block:'start'})}
  function md(src){
    let s=esc(src).replace(/\r\n/g,'\n');
    const blocks=[];
    s=s.replace(/```([\s\S]*?)```/g,(_,code)=>{blocks.push(`<pre><code>${code}</code></pre>`); return `@@BLOCK${blocks.length-1}@@`;});
    const lines=s.split('\n');
    let out=[], inList=false, inTable=false, tRows=[];
    function flushList(){if(inList){out.push('</ul>');inList=false}}
    function flushTable(){if(inTable){out.push('<table>'+tRows.join('')+'</table>');tRows=[];inTable=false}}
    for(let line of lines){
      let l=line.trimEnd();
      if(/^\|.*\|$/.test(l)){
        flushList();
        const cells=l.split('|').slice(1,-1).map(x=>x.trim());
        if(cells.every(c=>/^:?-{3,}:?$/.test(c))) continue;
        const tag=inTable?'td':'th';
        tRows.push('<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>');
        inTable=true;
        continue;
      } else {
        flushTable();
      }
      if(/^#{1,3} /.test(l)){
        flushList();
        const n=l.match(/^#+/)[0].length;
        out.push(`<h${n}>${inline(l.replace(/^#+\s*/,''))}</h${n}>`);
        continue;
      }
      if(/^[-*] /.test(l)){
        if(!inList){out.push('<ul>');inList=true}
        out.push(`<li>${inline(l.replace(/^[-*]\s*/,''))}</li>`);
        continue;
      }
      if(/^> /.test(l)){
        flushList();
        out.push(`<blockquote>${inline(l.replace(/^>\s*/,''))}</blockquote>`);
        continue;
      }
      if(!l.trim()){
        flushList();
        out.push('');
        continue;
      }
      flushList();
      out.push(`<p>${inline(l)}</p>`)
    }
    flushList();
    flushTable();
    s=out.join('\n');
    s=s.replace(/@@BLOCK(\d+)@@/g,(_,i)=>blocks[+i]);
    return s;
  }
  function inline(s){
    return s
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
  }

  function toggleObjectives(){document.querySelectorAll('#objList .objective').forEach(x=>x.classList.toggle('done'))}
  function ringBell(){const el=document.getElementById('bellState'); if(el) el.textContent='Bell state: rung / compound alert'}
  nav(); render(); renderDocList();

  </script>
