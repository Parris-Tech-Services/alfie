he party is coaxing **Rillix**, the Xelbrins' surviving tressym, from the ruined cottage before departing for Goldenfields.\n\n## Source-correct campaign flow\n\nThe party has completed Nightstone, the Ear Seekers defence, and the Dripping Caves rescue. They have returned to Nightstone safely, so the party is now **level 4**. Morak has offered the three sourcebook quests and the table chose **Goldenfields**. The **Tower of Zephyros** should appear the day after the party accepts Morak's quest.\n\n## Active quest\n\nTravel to **Goldenfields** and tell **Miros Xelbrin** that his parents, **Lathan and Melantha Xelbrin**, died in Nightstone when the giants attacked. If **Rillix the tressym** is alive, bring him safely to Miros.\n\n## Immediate next action\n\nWren should lead the gentle coaxing attempt. Alfie can help by softening a strip of dried beef with water and placing it within sight of Rillix without reaching toward him. Dorrin should stay still and non-threatening. Kella can watch exit routes without cornering the tressym.\n\n## Party\n\n- **Alfie / Alphie J. Roane** — Josh. Human noble wizard 4. D&D Beyond currently shows PHB 2024 Evocation build; earlier table continuity used 2014 Divination. Resolve before the next combat.\n- **Wren** — Talia. Bard 4. Emotional/social support, cat-friendly lead for Rillix.\n- **Dorrin Stonebrook** — Ben. Cleric 4 of Berronar Truesilver. Moral anchor and healer.\n- **Kella Darkhope** — Naomi. Former Zhentarim spy, now trial PC under party terms.\n\n## Party terms for Kella\n\nShared goals. Shared resources with records. No party theft. No PvP. No secret Zhentarim messages. No selling the party's route or plans. Kella is not treated as prisoner or charity case.\n\n## Key unresolved rules issue\n\nThe campaign has mostly been adjudicated as strict **2014 5e**. Alfie's current D&D Beyond sheet uses **2024 PHB** options: Evocation Wizard, Alert feat, Magic Initiate, and different ability scores. The table needs to decide whether to convert to 2024 rules or correct the sheet back to the 2014 Divination build.\n\n## Inventory highlights\n\nAlfie has no personal coin after paying 25 gp earnest money toward the 500 gp Nightstone horse restitution. He still has Roane cider trade goods, road food, writing supplies, signet, ledger, Goldenfields letter, and relief/restitution documents.\n\nBest Rillix bait: dried beef softened with water, or a tiny piece of smoked ham.\n"}, {"id": "ChatGPThandover27042026_md", "title": "Chatgpthandover27042026", "path": "ChatGPThandover27042026.md", "type": "md", "sizeKB": 19.2, "updated": "2026-04-27T11:49", "description": "Bookmark 5 — Nightstone recovery / Rillix the tressym", "content": "## Bookmark 5 — Nightstone recovery / Rillix the tressym\n\n**Current pause point:**\nThe party has accepted Morak’s **Goldenfields quest** and is currently at the ruined **Xelbrin Residence, Area 4H**, trying to coax out **Rillix**, the Xelbrins’ pet tressym. Rillix is alive, hiding in the wreckage, suspicious but not fleeing yet. Wren is best placed to lead the gentle approach; Alphie can assist with softened dried beef or smoked ham from the wagon.\n\n---\n\n# 1. Source-correct campaign position\n\nThe party has completed the opening Nightstone arc:\n\n* Cloud giants attacked Nightstone, killed many, damaged the keep and bridge, and stole the nightstone.\n* Villagers fled north to the Dripping Caves and were captured by Hark’s goblins and allied ogres.\n* Goblins spread through Nightstone looting, with named goblins in multiple areas.\n* Kella Darkhope was embedded in Nightstone as a Zhentarim spy.\n* Seven Snakes / Xolkin event occurred and was resolved through public oath rather than combat.\n* Ear Seekers / Gurrash event occurred and was resolved through defence of Nightstone, with Ardeep elves assisting.\n* Dripping Caves were resolved through negotiation, not a dungeon-clearing fight.\n* Source-correct next step: after surviving Dripping Caves and returning to Nightstone, the characters advance to **level 4**, Morak asks them to take one of three quests, and **Tower of Zephyros happens the day after they accept Morak’s quest**, not immediately. \n\nThe party chose **Goldenfields**.\n\n---\n\n# 2. Current party\n\n## Player characters\n\n### Alphie / Alfie J. Roane — Josh\n\nHuman noble wizard, currently level 4.\n\nCore identity:\n\n* House Roane noble / cider-trade family.\n* Lawful good, ledger-minded, oath-minded, practical.\n* Wants his father’s name carried rightly.\n* Speaks Common, Dwarvish, Elvish, Giant.\n* Has been acting as coalition commander / negotiator.\n\nImportant table caveat:\n\n* Table campaign has been running **strict 2014 5e** with Alphie as **School of Divination**.\n* Josh’s D&D Beyond screenshots show **PHB 2024**, **Evocation Wizard**, Alert feat, Magic Initiate, different stats, etc.\n* Before next combat, Marcus needs to decide whether table switches to 2024 rules/D&D Beyond sheet, or whether D&D Beyond needs correcting to match the 2014 Divination build.\n* Current D&D Beyond shows **Alfie, Human Wizard 4, HP 22/22, AC 12, initiative +4, INT 14, WIS 16, CHA 13**, Evocation traits. This conflicts with earlier table build.\n\nRecent role:\n\n* Killed Gurrash with Fire Bolt.\n* Negotiated with Hark.\n* Spoke Giant to the ogres and traded six spare horses for the safe release of villagers.\n* Created a 500 gp restitution note for the horses.\n* Asked Morak to tell travellers four names only: **Alphie Roane, Wren, Dorrin Stonebrook, Kella**.\n\n### Wren — Talia\n\nBard, now level 4 pending full update.\n\nCore identity:\n\n* Emotional barometer, bardic support, brave but honest about fear.\n* Strong interest in Kella’s story.\n* Wants Rillix the tressym brought safely to Miros.\n* Likely best person to coax Rillix out.\n\nKnown spells from corrected table continuity:\n\n* Sleep\n* Healing Word\n* Faerie Fire\n* Dissonant Whispers\n* Feather Fall\n* Invisibility was floated/used on statbook but should be verified against actual sheet.\n\n### Dorrin Stonebrook — Ben\n\nHill dwarf cleric of Berronar Truesilver, now level 4 pending full update.\n\nCore identity:\n\n* Moral anchor.\n* Hearth, family, oaths, mercy.\n* Protective, steady, not naïve.\n* Healer first, shield second.\n* Has consistently resisted “easy” immoral choices.\n\nImportant notes:\n\n* Witnessed Xolkin’s oath.\n* Accepted horse sacrifice as costly mercy, not clean righteousness.\n* Has Morak’s **Potion of Heroism** still by permission “until the roads are safe,” unless returned.\n* Channel Divinity had been unspent before long rest; after long rest all resources restored.\n\n### Kella Darkhope — Naomi\n\nOriginally NPC spy, now trial PC.\n\nCore identity:\n\n* Zhentarim spy sent to help turn Nightstone into a Black Network foothold.\n* Recruited into the party after Xolkin left.\n* Not “redeemed” automatically; choosing to travel under terms.\n* Morally grey, dry, professional, not a betrayal machine.\n\nParty terms spoken:\n\n* Shared goals.\n* Shared resources with records.\n* No party theft.\n* No secret Zhentarim messages.\n* No selling the party’s route or plans.\n* No PvP.\n* Party does not treat Kella as prisoner or charity case.\n* Dorrin does not trust her yet, but accepts terms.\n* Wren wants the relationship to stay playable, not stressful.\n\n---\n\n# 3. Current exact scene\n\nThe party is at **Xelbrin Residence, Area 4H**.\n\nSource facts:\n\n* Lathan and Melantha Xelbrin died when the roof collapsed.\n* Melantha was the village notary / record keeper.\n* Rillix, their pet tressym, lurks in the wreckage.\n* Their son Miros lives in Goldenfields; Morak asked the party to take news of their deaths and deliver Rillix safely if alive. \n\nScene state:\n\n* Rillix has been seen: ash-grey, darker stripes, feathered wings, green-gold eyes.\n* He is hiding in the shadows of the ruined cottage.\n* Not hostile.\n* Suspicious and ready to bolt.\n* Wren called gently.\n* Kella observed that the cat is judging everyone.\n* Dorrin agreed the cat should judge them.\n* Marcus said this needs one good gentle approach, likely Wren leading.\n\nAlphie asked what items he has; current useful bait:\n\n* dried beef, softened with water;\n* tiny bit of smoked ham;\n* possibly Prestidigitation smell/flavour tricks;\n* dried apples unlikely to help.\n\n---\n\n# 4. Alphie’s current inventory\n\n## On Alphie / personal gear\n\n* Spellbook\n* Component pouch\n* Wand of Magic Detection / Detect Magic focus, if using D&D Beyond item\n* Quarterstaff\n* 2 daggers\n* Scholar’s pack / backpack\n* Book\n* Calligrapher’s supplies\n* Parchment\n* Ink bottle\n* Quills\n* Dragonchess set\n* Fine/noble clothes\n* Robe / spare robe\n* Fur warm clothes\n* Signet ring\n* Scroll of pedigree / noble papers\n* Roane wax/seal materials\n* Ledger book\n* Goldenfields letter for Miros Xelbrin\n* Roane relief letters / horse restitution documentation\n\n## Personal coin\n\nAfter paying the 25 gp earnest deposit for the horse restitution:\n\n**0 gp personal coin on hand**, unless D&D Beyond coin is being treated as current and needs reconciliation.\n\n## Wagon supplies\n\n### Cider\n\nOriginally 4 small Roane trade casks, about 20L each.\n\nGiven to Morak for village supper:\n\n* 1 × 20L Roane dry apple cider\n* 1 × 20L Roane spiced apple cider\n\nStill in wagon:\n\n* 1 × 20L Roane dry apple cider\n* 1 × 20L Roane pear-apple cider\n* 6 sealed sample bottles, 750ml each\n\n### Food\n\n* 24 hard travel biscuits\n* 2 small sacks dried apples\n* 1 wrapped bundle smoked ham strips, about 4 person-days\n* 1 wrapped bundle dried beef, about 4 person-days\n* 12 oat cakes\n* 1 small sack walnuts, about 2 lb\n* 1 small honey jar, half full\n* 1 salt pouch\n* 4 full waterskins\n* 1 small sack horse oats, about 1 day for remaining mounts\n\n### Camp/travel gear\n\n* 4 bedrolls / blankets\n* 1 spare wool blanket\n* 1 cooking pot\n* 4 tin cups\n* 4 wooden bowls\n* flint and steel\n* 1 lantern\n* 1 oil flask\n* 1 × 50 ft hemp rope\n* spare parchment, 8 sheets\n* ink bottle\n* 3 quills\n* sealing wax\n* Roane signet on Alphie\n* ledger book\n\nVillage emergency gear was either returned or recorded as borrowed.\n\n---\n\n# 5. Nightstone inventory / restitution state\n\n## Returned to Morak\n\n* dwarf-sized chain mail\n* dwarven helm\n* 45 gp\n* two 100 gp gemstones\n* dented silver jug\n* cracked hourglass\n* cook’s utensils\n* frying pan\n* iron pot\n* lantern and oil\n* saffron and cloves\n\n## Still held by party with permission\n\n* **Potion of Heroism**: Morak allowed Dorrin to keep it until roads are safe. This should be either returned before departure or formally recorded as lent.\n\n## Restitution debt\n\nSix Nightstone horses were fed to the ogres as part of the Dripping Caves bargain.\n\nMarket-ish value:\n\n* 4 draft horses × 50 gp = 200 gp\n* 2 riding horses × 75 gp = 150 gp\n* Emergency/livelihood restitution agreed at **500 gp**.\n\nAlphie:\n\n* paid 25 gp immediately;\n* wrote sealed Roane note for remaining **475 gp**;\n* wrote relief letters for horses, timber, grain, bridge materials, nails, canvas, labour, and support.\n\nWitnessed by:\n\n* Morak\n* Dorrin\n* Sydiri\n\n---\n\n# 6. Chronology so far\n\n## Arrival / early Nightstone\n\nThe party arrived at Nightstone after hearing the temple bell. The drawbridge was down, towers unguarded, keep damaged, bridge to keep broken, and village seemingly abandoned.\n\nGoblins were present across Nightstone:\n\n* Gwerk at 2D\n* Larv and Snokk at 2E\n* Pojo and Tot at 4C\n* Blik and Flik at 4G\n* Beedo and Vark at 5B\n* Derp in 7B\n* dead inn goblin in 8A, killed by Kella\n* Gum-Gum in 8B\n* Jilk at 9\n* Longo and Yek in 10\n\nThe worgs were in the square.\n\n## Inn / Kella / Gum-Gum\n\nKella was discovered in Morak’s inn. She was a Zhentarim spy, originally disarmed and under terms. Gum-Gum was interrogated and revealed:\n\n* villagers were in Dripping Caves;\n* Hark was boss;\n* ogres were present;\n* Morak likely alive;\n* Beedo and Vark were ringing bell.\n\nAlphie kept his word and released Gum-Gum with food.\n\nThis mattered later: Alphie invoked Gum-Gum by name in negotiation with Hark.\n\n## Morak’s chest\n\nMorak’s chest was opened and contents held in safekeeping:\n\n* chain mail\n* helm\n* 45 gp\n* two 100 gp gemstones\n* Potion of Heroism\n\n## Temple and stable\n\nParty avoided temple goblins initially because bell was tactically useful.\n\nAt stables:\n\n* Derp was in hayloft.\n* Party initially fled on horses bareback.\n* Later returned, properly tacked and calmed horses.\n* Derp was killed by Alphie’s thrown dagger after Dorrin was nearly killed by Derp’s crit arrow.\n\n## Worg fight\n\nParty/coalition killed two worgs in the square.\nAlphie used Magic Missile early in fight and later repositioned.\n\n## Seven Snakes / Xolkin\n\nXolkin Alassandar and the Seven Snakes arrived for Kella.\n\nInstead of combat, Alphie negotiated:\n\n* Kella was treated as specialist, not prisoner.\n* Xolkin entered temporary alliance.\n* Public oath eventually sworn in front of Dorrin, Sydiri, and Lady Velrosa’s body.\n* Xolkin agreed no banners, no claim, no recruitment, no Black Network business until villagers rescued.\n\nImportant source relationship:\n\n* Xolkin is in love with Kella and would do almost anything for her; this was a key lever. \n\n## Keep / Sydiri\n\nParty built a temporary footbridge at Area 11 using structural timber.\nKella crossed first.\nAlphie and Dorrin crossed to Nandar Keep.\n\nFound:\n\n* Lady Velrosa Nandar dead, honoured in great hall.\n* Sydiri Haunlar\n* Torem Breck, broken arm\n* Alara Winterspell\n* Kaelen Zam, head wound\n\nDorrin healed Kaelen.\nSydiri and Alara later joined rescue/defence.\nTorem and Kaelen remained as support.\n\n## Ear Seekers / orc defence\n\nParty spotted Gurrash’s orc warband approaching.\n\nAlphie chose to defend Nightstone rather than ride to caves with orcs at their back.\n\nDefensive setup:\n\n* western drawbridge raised;\n* archers/crossbows on towers;\n* Dorrin cast Bless;\n* Wren used Faerie Fire;\n* Alphie used Portent to force Gurrash’s failed save;\n* Alphie used Portent 5 to break Norgra’s Bless concentration via Magic Missile;\n* Kella killed Norgra;\n* Alphie killed Gurrash with Fire Bolt.\n\nArdeep elves arrived after horn signal:\n\n* Rond Arrowhome and seven scouts.\n* Helped finish/rout orcs.\n* Source event says elves can arrive if party is in danger of being overwhelmed; this was adapted through a horn invitation and nat-20 perception/Persuasion. \n\nOutcome:\n\n* Gurrash dead.\n* Norgra dead.\n* Orc warband broken.\n* No allied deaths.\n* The horn relationship between Nightstone and Ardeep now exists:\n\n  * Ardeep will answer for captives, children, or orcs.\n  * Not for politics.\n\n## Dripping Caves rescue\n\nAfter defeating orcs, Rond agreed to help rescue villagers.\n\nFinal coalition to caves:\n\n* Alphie\n* Dorrin\n* Wren\n* Kella\n* Xolkin\n* Joren\n* Sydiri\n* Alara\n* Rond + seven Ardeep scouts\n\nSplit plan:\n\n* South mouth visible pressure: Alphie, Dorrin, Xolkin, Joren, Sydiri, Alara, several elves\n* Chimney extraction: Kella, Rond, Wren, three elves\n\nAlphie negotiated with Hark:\n\n* natural 20 Persuasion.\n* Hark accepted safe passage bargain.\n* Villagers exited south mouth.\n* Goblins exited west stream tunnel.\n* No arrows on goblins if they carried no captives/bones and didn’t go toward Nightstone.\n* Ogres not part of Hark’s bargain.\n\nAlphie heard ogres in Giant:\n\n> “Why food walking?”\n\nHe understood they still thought villagers were food and had not been told of the deal.\n\nAlphie spoke Giant to the ogres and offered six spare horses if they waited and let the villagers leave.\n\nRolled nat 20. Ogres accepted.\n\nCost:\n\n* six spare Nightstone horses lost.\n* no civilian casualties at cave mouth.\n* no combat.\n\nOutcome:\n\n* villagers extracted alive enough for operational success;\n* Morak alive;\n* no allied deaths;\n* Hark and goblins left under safe passage;\n* ogres remained in cave with horses, satisfied for now but not permanently resolved.\n\n## Return to Nightstone\n\nMorak was told the truth:\n\n* giants attacked;\n* Lady Velrosa died;\n* goblins looted;\n* worgs killed;\n* orcs defeated;\n* Black Network was involved but restrained under oath.\n\nAlphie asked Morak to carry the names:\n\n* Alphie Roane\n* Wren\n* Dorrin Stonebrook\n* Kella\n\nNot as heroes. Just by name. For his father.\n\n## Zhentarim resolution\n\nAt the gate:\n\n* Xolkin fulfilled oath.\n* Sydiri chose not to arrest him.\n* Xolkin and Seven Snakes agreed to leave before sundown.\n* Kella chose not to ride south with Xolkin.\n* Kella spoke with Alphie/Wren/Dorrin and joined party on terms.\n* Naomi joined table in real life and took Kella as trial PC.\n\n---\n\n# 7. Table / player status\n\nPlayers:\n\n* Josh: Alphie / Alfie\n* Talia: Wren\n* Ben: Dorrin\n* Naomi: Kella, newly joined as trial player\n\nTable agreements:\n\n* Originally strict 2014 5e.\n* No PvP violence.\n* No stealing from party.\n* No secret betrayal arc unless table opts in.\n* Kella is morally grey, not table-hostile.\n* Safety word: “pause.”\n* Kella can become her own character under Naomi, not just Marcus’s NPC voice forever.\n\nCurrent real-world issue:\n\n* D&D Beyond screenshots show 2024 Wizard/Evocation build.\n* Need table check before next fight: continue 2014 Divination, or convert campaign to 2024 D&D Beyond version.\n\n---\n\n# 8. Current quests and obligations\n\n## Active quest: Goldenfields\n\nAccepted from Morak.\n\nDeliver news:\n\n* Lathan and Melantha Xelbrin died in Nightstone.\n* Their son Miros Xelbrin lives in Goldenfields.\n\nAdditional task:\n\n* Bring Rillix the tressym safely to Miros if possible.\n\n## Pending source beat\n\nAfter accepting Morak’s quest, the **Tower of Zephyros** should appear the next day, not immediately.\n\n## Nightstone obligations\n\n* Horse restitution: 500 gp owed, 25 gp paid, 475 gp remaining.\n* Relief letters to House Roane / Daggerford contacts.\n* Bridge repair and village support.\n* Lady Velrosa still needs proper honour/funeral.\n* Nightstone rebuilding continues under Morak and Sydiri.\n* Potential future horn connection with Ardeep.\n\n---\n\n# 9. NPC state\n\n## Nightstone\n\n### Morak Ur’gray\n\nAlive. Innkeeper. Natural village leader. Knows party returned his goods. Holds Roane restitution note. Asked party to go to Goldenfields.\n\n### Sydiri Haunlar\n\nAlive. Acting security leader. Trusts Alphie/Dorrin. Maintains Nightstone authority. Let Xolkin leave due to oath kept.\n\n### Alara Winterspell\n\nAlive. Young guard. Brave. Helped rescue and orc defence.\n\n### Torem Breck\n\nAlive. Broken arm. Stayed behind at keep/gatehouse. Held bridge/snake protocol earlier.\n\n### Kaelen Zam\n\nAlive. Healed head wound. Horse handler/support. Concussed but recovering.\n\n### Lady Velrosa Nandar\n\nDead. Body honoured in keep. Not looted. Wedding ring untouched.\n\n## Zhentarim\n\n### Xolkin Alassandar\n\nAlive. Left Nightstone before sundown. Kept oath. Still dangerous. Still loves Kella. Will report truth to Black Network.\n\n### Seven Snakes\n\nLeft with Xolkin except Kella.\nNamed table-canon members included:\n\n* Tessa\n* Pell\n* Joren\n* Maks\n* Hask\n  Some were used as defenders/watchers during Nightstone defence. Current ongoing relevance likely low except Joren as possible future thread.\n\n### Kella Darkhope\n\nNow party PC controlled by Naomi.\nFormer Black Network spy.\nJoined on terms.\nNo secret messages, no party theft, no PvP.\n\n## Ardeep elves\n\n### Rond Arrowhome\n\nAlive. Returned to Ardeep after rescue. Respects Alphie but not a travelling companion. Horn relationship exists.\n\n### Seven wood elf scouts\n\nAlive. Returned with Rond.\n\n## Goblins / Hark\n\n### Hark\n\nAlive. Left via west stream tunnel under safe passage. Self-preservation-based deal. Not good, but kept terms.\n\n### Gum-Gum\n\nAlive, released earlier. Credited publicly by Alphie as clever and useful.\n\n### Other Nightstone goblins\n\nSome killed, some possibly fled or were captured. Current local danger from goblins is effectively resolved unless Marcus chooses loose ends.\n\n## Ogres\n\nTwo ogres alive in Dripping Caves, fed six horses. They are not pursuing today. They remain a future risk if ignored long-term, but not immediate.\n\n---\n\n# 10. Current tactical state\n\nLocation:\n\n* Nightstone, Xelbrin Residence, Area 4H.\n\nTime:\n\n* After long rest and quest choice.\n* Before Tower of Zephyros.\n* Likely morning after Nightstone recovery, or close enough.\n\nParty condition:\n\n* Level 4.\n* Long rested.\n* Kella now part of party.\n* Need ruleset reconciliation before combat.\n\nImmediate goal:\n\n* Coax **Rillix the tressym** safely out.\n* Then prepare to depart for Goldenfields / trigger Tower of Zephyros next day.\n\nBest immediate play:\n\n* Wren leads Animal Handling/Persuasion.\n* Alphie assists by softening dried beef with water and placing it gently within sight.\n* Dorrin stays still and non-threatening.\n* Kella quietly watches possible exit routes but does not “corner” Rillix unless needed.\n\nSuggested declaration:\n\n> Alphie crouches low outside the broken cottage, softens a strip of dried beef with a little water, and places it on a clean bit of stone where Rillix can see it. He does not reach toward the tressym.\n> “Wren, I think he needs your voice more than mine.”\n> Then Alphie stays still and lets Wren lead.\n\n---\n\n# 11. Open questions to resolve next\n\n1. **Ruleset/build:** Is Alphie 2014 Divination Wizard or 2024 Evocation Wizard from D&D Beyond?\n2. **Kella rebuild:** Use Spy stat block for now, or rebuild as level 4 Rogue before next combat?\n3. **Potion of Heroism:** Return to Morak before leaving or formally borrow?\n4. **Rillix:** Does the party coax him gently, or does he bolt and need tracking?\n5. **Goldenfields route:** After Rillix, proceed to Tower of Zephyros the next day.\n6. **Roane restitution:** Long-term tracking of 475 gp owed to Nightstone.\n7. **Nightstone loose goblin/property audit:** Can be broad-brushed unless party wants to clear every remaining goblin/building.\n"}, {"id": "ClaudeHandover27042026_md", "title": "Claudehandover27042026", "path": "ClaudeHandover27042026.md", "type": "md", "sizeKB": 36.0, "updated": "2026-04-27T11:52", "description": "Storm King's Thunder — Dubbo Table — Resume Checkpoint 5", "content": "# Storm King's Thunder — Dubbo Table — Resume Checkpoint 5\n## Full Handover for Resuming DM\n\n**Pause point:** Second of Eleint, 1493 DR, late morning. Nightstone village square. The villagers are home. Lady Velrosa's body is in the keep awaiting proper burial. The 500 gp horse-restitution has been signed and witnessed. Kella has just asked Alphie *\"So this is what your house does?\"* — and the conversation she actually wants (whether to ride with the party) has been deferred so Wren can have it as a party conversation. Xolkin will leave by noon. Rond and the Ardeep have left for the forest with the horn relationship intact. Talia and Ben are about to discuss recruitment options at the table.\n\n---\n\n## How to use this document\n\nYou are taking over as **Marcus**, the calm, grounded DM persona running Storm King's Thunder for Josh as Alphie J. Roane. Josh controls Alphie only. Other PCs (Wren, Dorrin) are run by other real players (Talia, Ben) at the table. In the current solo replay through chat, Josh is replaying as if Marcus were running the whole table, so you voice Wren, Dorrin, all NPCs, and the world.\n\n**Hard rules for the next DM:**\n\n- Strict 2014 D&D 5e RAW only. No house rules, no homebrew, no 2024 rules.\n- Storm King's Thunder source material is canon. DM extensions are flagged as table-canon.\n- Don't roll for Josh. He rolls his own dice and reports results.\n- Don't fudge dice to save characters; don't go out of the way to kill them.\n- Two-minute lookup limit. Make a ruling, note it, fix later if wrong.\n- Pause is the safety word.\n- Tone: M-rated, serious but not grim. No graphic torture, no on-screen harm to children, no sexual content beyond fade-to-black, avoid body horror (Talia is squeamish).\n- Marcus's voice: calm, grounded, slightly dry, openly acknowledges mistakes.\n- Josh prefers honest engagement, short and practical Australian English, do not call him 'mate.'\n\n---\n\n## Immediate restart block\n\n> *The square is loud now in a different way. Villagers are eating bread and cheese on broken stoops. Children have started crying properly, which is better than the silent staring they did walking out of the cave. Sydiri has Alara organising roof-pair checks. Morak has the restitution note in his pocket and is already shouting at someone about the windmill. Kella is by the well, hands empty, waiting. Wren is near Dorrin and has said she wants the Kella conversation to be a party one. Xolkin and the Seven Snakes are at the south road, leaving by noon. Rond and the Ardeep are gone. Lady Velrosa is in the keep, awaiting burial. It is the first quiet hour of the day. Alphie has supper with villagers ahead, a party conversation about Kella, and the slow work of a village rebuilding around him.*\n\n---\n\n## Table context\n\n- **Campaign:** Storm King's Thunder, 2014 D&D 5e, strict.\n- **DM persona:** Marcus, run by Claude/ChatGPT.\n- **Real-world venue:** local games store in Dubbo, NSW, owned by Dave (ex-teacher).\n- **Session 0:** Saturday 25 April 2026, ANZAC Day, 1:00 pm.\n- **Schedule:** Saturdays 1:00–4:00 pm, pack-up by 4:30 pm. Three-month commitment through end of July 2026.\n- **Group chat:** WhatsApp, \"Storm King's Dubbo.\"\n- **Players:** Josh (Alphie), Talia (Wren), Ben (Dorrin).\n- **Real-world context Saturday afternoon:** Dave restocking sleeves, Pokémon League at the front, ~1 hour of play time before pack-up when last we OOC'd.\n\n---\n\n## Corrections log carried forward\n\nMarcus drifted on a few mechanics in earlier play. Run the corrected versions:\n\n- **Level 2 spell slots:** Wizard 2, Cleric 2, Bard 2 each get **three 1st-level slots**, not a 2nd-level slot. 2nd-level slots arrive at level 3.\n- **HP at level 2 (corrected):** Wren 10 → 17 (Bard d8 fixed 5 + CON 2). Dorrin 12 → 21 (Cleric d8 fixed 5 + CON 3 + Dwarven Toughness 1).\n- **Goblin count in Nightstone:** ~15 named goblins originally; ~9–10 still active when the orc fight started. Beedo and Vark in the temple belfry remain unaccounted for.\n- **Seven Snakes count:** Xolkin + 6 bandits, source-correct. Named in play: Tessa (sergeant), Pell, Joren, Maks, Hask. One unnamed.\n- **Wren's spells:** Sleep, Healing Word, Faerie Fire, Dissonant Whispers (sheet rules; Tactical Dossier mistakenly listed Thunderwave).\n- **Drift dropped:** no mysterious hooded observer with the Seven Snakes; that was earlier drift, scrubbed.\n- **Ogres are not \"fed for a week\":** they are *delayed and satisfied today, unlikely to pursue.* That's the honest wording.\n\n---\n\n## Party roster (level 3, end of Battle of Nightstone + cave rescue)\n\n### Alphie J. Roane — Human Wizard 3, School of Divination\n\n- Player: Josh. LG. Noble background, House Roane (cider traders, Waterdeep hinterlands).\n- HP 20. AC 12 / 15 with Mage Armor (currently up, ~6 hours remaining as of pause).\n- Speed 30. Spell save DC 13, spell attack +5.\n- Saves: INT +5, WIS +2 proficient.\n- Skills proficient: Arcana +5, History +5, Investigation +5, Persuasion +3.\n- **Slots used today:** 2 first-level (Mage Armor, Magic Missile). **Current state: 2/4 first-level, 2/2 second-level.** Long rest tonight will restore.\n- Cantrips: Fire Bolt, Mage Hand, Prestidigitation.\n- Spellbook (1st): Mage Armor, Shield, Sleep, Magic Missile, Detect Magic ritual, Find Familiar ritual, Grease, Feather Fall.\n- Spellbook (2nd): two of Misty Step / Mirror Image / Web / See Invisibility / Detect Thoughts / Hold Person — **player picks at the level-3 beat. Recommend Misty Step + Web for cave country.**\n- Prepared: 4 (INT 3 + level 1) — typically Mage Armor, Shield, Sleep, Magic Missile + Grease added.\n- **Divination Savant** active (half cost/time scribing divination spells).\n- **Portent** active: 2d20 rolled fresh after each long rest, hold them, replace any d20 roll before result is known. Both Portent dice spent during the orc fight (4 on Gurrash's DEX save vs Faerie Fire, 5 on Norgra's first concentration save). **Both dice should re-roll on next long rest.**\n- Languages: Common, Giant, Elvish. Tools: Dragonchess set. No thieves' tools.\n- Familiar: raven, named **Ink** — concept established, not yet summoned. 1-hour ritual, 10 gp components in pouch.\n- Personality: polite, scholarly, tactical, morally serious. Wants noble rank to mean service. Investigator-minded. Strong concern for villagers and his given word.\n\n### Wren — Half-Elf Bard 3, College of Lore\n\n- Player: Talia. CG. Entertainer background.\n- HP 24. AC 13 leather. Spell save DC 13, spell attack +5.\n- Saves: DEX +4, CHA +5 proficient.\n- Skills proficient at college: Acrobatics +4, Deception +5, History +2, Insight +3, Perception +3, Performance +5, Persuasion +5, plus three Bonus Proficiencies from College of Lore (suggest Investigation, Arcana, Stealth — Talia's call at table).\n- **Slots used today:** 2 first-level (Sleep on Gum-Gum, Faerie Fire vs Gurrash). **Current state: 2/4 first-level, 2/2 second-level.** Long rest restores.\n- Cantrips: Vicious Mockery, Minor Illusion.\n- Spells known: Sleep, Healing Word, Faerie Fire, Dissonant Whispers + Heroism (level 2 add) + 1 from level 3 (suggest Suggestion as 2nd-level pick — Talia's call).\n- Bardic Inspiration: d6, **3/3 available** (none used in orc fight). Restored on long rest.\n- **College of Lore active:** Bonus Proficiencies + **Cutting Words** (reaction, expend Bardic Inspiration die to subtract from a creature's attack/check/damage roll within 60 ft, after the roll but before DM applies it).\n- Languages: Common, Elvish, Dwarvish. Tools: lute, flute, drum, viol, disguise kit.\n- Personality: warm, witty, observant, nervous-but-capable. Performed once at a Roane gathering. Remembers Alphie because he treated her like a person. Acts as moral/social barometer. Just saw something inside the caves with Kella that she has not yet talked about.\n\n### Dorrin Stonebrook — Hill Dwarf Cleric 3, Life Domain\n\n- Player: Ben. LG. Acolyte of Berronar Truesilver.\n- HP 30. AC 18 chain mail + shield. Speed 25.\n- Spell save DC 13, spell attack +5.\n- Saves: WIS +5, CHA +2 proficient.\n- Skills: Insight +5, Medicine +5, Persuasion +2, Religion +2.\n- **Slots used today:** 4 first-level (Cure Wounds on Kaelen, Bless in orc fight, Healing Word on Sydiri, Bless at cave) + 1 second-level (Aid before caves). **Current state: 0/4 first-level, 1/2 second-level.** Long rest restores.\n- **Channel Divinity:** unused today. 1/short or long rest. Options: Turn Undead, **Preserve Life** (5 × level = 15 HP pool, 30 ft range, no creature above half max).\n- Cantrips: Guidance, Sacred Flame, Spare the Dying.\n- Prepared: WIS 3 + Cleric 3 = 6 + Life Domain always-prepared (Bless, Cure Wounds, Lesser Restoration, Spiritual Weapon).\n- Disciple of Life: Cure Wounds 1d8+6, Healing Word 1d4+6 at this level.\n- Languages: Common, Dwarvish, Celestial, Giant.\n- Carries Morak's safekeeping: dwarf-sized chain mail, dwarven helm, identified Potion of Heroism. **Will return to Morak now that the rescue is complete.**\n- Personality: quiet, steady, moral, protective. Just stood with Alphie in the cost of the horses-for-ogres bargain (\"Those horses bought lives. Still hurts. It should.\").\n\n### Kella Darkhope — NPC ally, Spy stat block\n\n- HP 27/27. AC 12. Multiattack with shortsword + hand crossbow. Sneak Attack +2d6 (1/turn).\n- Cunning Action (Hide / Disengage as bonus). Speaks Common, Goblin, Thieves' Cant.\n- Weapons: hand crossbow, short blade, boot knife (returned by Alphie before orc fight).\n- Winged snake messenger: returned to her after she fetched it back from Torem post-battle. Available again.\n- **Insight read:** cooperating for self-interest, will betray if betrayal becomes useful, currently sees cooperation as best path. Vouched publicly for Alphie to Xolkin. Just witnessed Alphie write a 500 gp restitution note for horses and is *processing*.\n- **Status as of pause:** Xolkin offered her ride-out at the south road by noon. She told him *\"I'll speak with Roane first.\"* She is now at the well in the square waiting on a private word. Wren has flagged she wants this to be a party conversation.\n\n---\n\n## Coalition that fought the Battle of Nightstone\n\n| # | Member | Role | HP | AC | Loyalty |\n|---|---|---|---|---|---|\n| 1 | Alphie J. Roane | Coalition commander, diviner, negotiator | 20 | 12/15 Mage Armor | Party / House Roane |\n| 2 | Dorrin Stonebrook | Frontline priest, healer, oath-witness | 30 | 18 | Party / Berronar Truesilver |\n| 3 | Wren | Bardic support, morale, control, scout-social reader | 24 | 13 | Party |\n| 4 | Kella Darkhope | Spy, translator, quiet extraction specialist | 27 | 12 | Temporary ally / Zhentarim |\n| 5 | Xolkin Alassandar | Bandit captain, temporary military ally | 65 | 15 | Seven Snakes / Zhentarim under oath |\n| 6 | Joren | Zhent bandit, crossbow support | 11 | 12 | Seven Snakes / under Xolkin |\n| 7 | Sydiri Haunlar | Sergeant of Nightstone, local authority | 22 | 16 | Nightstone Guard / Lord's Alliance |\n| 8 | Alara Winterspell | Young guard, crossbow and local legitimacy | 11 | 16 | Nightstone Guard |\n| 9 | Rond Arrowhome | Wood elf scout captain | 16 | 13 | Ardeep Forest / temporary rescue ally — **departed** |\n| 10–16 | 7 Ardeep Scouts (Lieutenant + 6) | Bow support, chimney route, ridge guard | 16 each | 13 | Ardeep Forest / **departed** |\n\n**Stays at Nightstone post-battle:** Sydiri (in command), Alara, Torem (gatehouse, broken arm), Kaelen (recovering, with horses), Pell + Maks (released from western drawbridge, may have left with Xolkin's column or stayed in town pending captain's order — DM rules in scene), Tessa (released from temple overwatch, likely with Xolkin).\n\n---\n\n## Full chronology of events to date\n\n### Session 0 (Saturday 25 April 2026)\n\n- Josh arrived first; Marcus checked Alphie's sheet (point buy legal, standard human, noble background, Giant approved as scholarly language, Find Familiar 10 gp pre-bought, raven Ink chosen conceptually).\n- Talia arrived with Wren. Ben arrived late (roadworks near Geurie) with Dorrin.\n- Table agreements: strict 2014 5e, milestone levelling, no PvP, romance opt-in, components tracked only if costly, encumbrance only if it matters, two-minute rules lookups, no dice fudging, food/drink ok no alcohol.\n- Storm King's Thunder pitch given (spoiler-light): Savage Frontier, broken Ordning, giants moving.\n- Soft opening: cart journey on the High Road toward Nightstone.\n\n### The cart ride to Nightstone\n\n- Three hours, Sace pulling. Date: Second of Eleint, 1493 DR (Year of Three Ships Sailing), late afternoon.\n- Road unusually empty.\n- Player ties: Alphie investigating silent Roane trade contact in Nightstone; Wren due to perform at the inn; Dorrin sent north on strange-reports rumour.\n\n### Arrival at Nightstone\n\n- Bell ringing wildly, drawbridge down, two worgs in the square feeding on a dead dog.\n- Marcus correction: initially described back-wall breach; corrected to source — palisade intact, villagers fled by drawbridge, tracks lead north.\n- Alphie threw copper coin to distract worgs (13 vs DC 12). Party moved into cottage 4A.\n\n### Cottage 4A investigation\n\n- Ransacked, half-eaten meal, child's wooden horse toy, small clawed goblin footprints, no bodies, large rock through roof.\n- Alphie deduced: family fled in a hurry but not dragged; goblins searched after; villagers likely fled alive; sky attack not ground attack.\n\n### Nightstone Inn\n\n- Wren watched kitchen window; Dorrin overwatch; Alphie went upstairs.\n- Found Morak's letter, iron hammer token, locked chest in 8C.\n- Wren saw goblin Gum-Gum in kitchen looting.\n\n### Gum-Gum captured\n\n- Initiative: Alphie 20, Wren 18, Gum-Gum 11 surprised, Dorrin 4.\n- Alphie chose restraint; Wren cast Sleep (24 HP roll, Gum-Gum at 7 HP, slept instantly); Dorrin tied her to the fireplace leg.\n- Wren's Sleep spent. Sack contained: muffins, cheese, cooked chicken, frying pan, iron pot, lantern, oil, cook's utensils, jar of cloves, jar of saffron, dented silver jug, cracked hourglass.\n\n### Upstairs sweep\n\n- Rooms 8D, 8E empty. 8F damaged, someone hiding — **Kella**.\n\n### Kella exposed\n\n- Alphie rolled **Nat 20 +5 Investigation = 25**. Deduced false survivor story (too clean, tactical hiding spot, trained posture, winged snake messenger, protected parchment).\n- Alphie intimidated her: 14 and 1 with advantage, +1 = 15. Just enough.\n- Kella dropped note: **\"On our way.\"**\n- Forced disarm: hand crossbow, short blade, boot knife. Snake remained.\n\n### Kella interrogation and temporary alliance\n\n- Alphie's logic: dead village useless to Black Network foothold; cooperation serves her mission.\n- Kella admitted Black Network wants Nightstone, giants ruined plan, goblins ringing bell, she killed the dining room goblin, associates arriving.\n- Alphie rolled **Insight 18:** cooperating for self-interest, will betray if useful.\n- Polite leash terms set.\n\n### Morak's chest opened\n\n- DC 15 Strength break, bedding muffled sound, bell cover. Dorrin rolled 18. Success.\n- Contents: dwarf chain mail, dwarven helm, 45 gp, 2× 100 gp gems, golden potion (later identified as **Potion of Heroism**).\n\n### Gum-Gum interrogated\n\n- Kella translated. Alphie Persuasion 19. Success.\n- Revealed: goblins from Dripping Caves ~1 mile north; goblin boss **Hark**; villagers captive; Morak alive; ogres present and hungry; **Beedo and Vark** in temple bell; worgs with raiders.\n- Alphie briefly considered Kella-assassinating Gum-Gum. Marcus flagged dark choice. Wren and Dorrin opposed. Alphie kept his word and released Gum-Gum with food.\n\n### Stable escape\n\n- Failed Stealth on temple retreat. Worgs triangulated.\n- Stable had 5 draft + 5 riding horses, tack on wall, **Derp** in hayloft.\n- Bareback escape: Alphie 18, Wren 17, Dorrin 15, Kella succeeded.\n- Derp shouted \"BAD HORSE THIEVES!\" Fired arrow, missed.\n- All escaped over drawbridge.\n\n### Cold camp\n\n- Reunited with Sace and cart. Cold camp: half mile off main trail, hidden, no fire.\n- Bell faded and stopped during journey.\n- Watch 1 (Wren+Dorrin): clean, distant moving light SW road.\n- Watch 2 (Alphie+Kella): Kella asked *\"Do you always keep your word after threatening to break it?\"* Josh kept watch alone, gave companions full long rest.\n\n### Watch 2 — Xolkin's arrival\n\n- ~3 hours into watch, hoofbeats on the High Road south. Hooded lanterns.\n- Alphie rode out with Kella unarmed, Wren and Dorrin flanking, lantern lit by Wren.\n- Six riders, seven horses (one led for Kella). Xolkin Alassandar leading.\n- Three Persuasion rolls: 18, 19, **Nat 20 (23 total)**. Got Xolkin to dismount, set weapons-down norms, offer terms, then make a personal undertaking on the cave engagement.\n- Dorrin's witness speech in front of Berronar bound Xolkin's command authority.\n\n### Pre-dawn at the cold camp\n\n- Mage Armor up. Detect Magic ritual identified Potion of Heroism. Find Familiar deferred (1-hour cost).\n- Kella's weapons returned hilt-first.\n\n### Crossing back to Nightstone keep\n\n- Riders mounted. Approached the Area 11 broken bridge. Built temporary footbridge from timber retrieved by Xolkin's bandits (Tessa+Pell at trading post yard, Joren+Hask at stable shed).\n- Kella crossed first tethered (Acrobatics 11 vs DC 10).\n- Sydiri called from inside: *\"Name yourself!\"*\n- Alphie crossed (Acrobatics 19), Dorrin crossed (Acrobatics 12).\n\n### Inside Nandar Keep\n\n- Source-correct: Lady Velrosa Nandar dead, laid out with sword on folded cloak. Four guards alive: **Sydiri Haunlar** (sergeant, whole), **Alara Winterspell** (19, whole, crossbow), **Torem Breck** (41, broken right arm), **Kaelen Zam** (18, head wound).\n- Dorrin healed Kaelen (Cure Wounds 11 HP). Set Torem's splint.\n\n### The oath ceremony with Xolkin\n\n- Alphie set alliance terms publicly over Lady Velrosa's body, in front of Sydiri and Dorrin.\n- Symmetry that won the moment: *\"If he breaks that, I stand with you. If the guards break terms against you while you are keeping faith, I stand against that too.\"*\n- Xolkin gave his word, palm over heart in half-elven oath gesture.\n- Sydiri named Daggerford's magistrate. Dorrin: *\"Berronar Truesilver hears it. The oath holds.\"*\n\n### Level 2 milestone\n\n- Marcus called level 2 here, ahead of published level-3 milestone. Five-minute scene.\n- Alphie: HP 14, +Grease and +Feather Fall to spellbook, School of Divination active, Portent online.\n- Wren: HP 17, three 1st-level slots, Jack of All Trades and Song of Rest d6.\n- Dorrin: HP 21, three 1st-level slots, Channel Divinity (Preserve Life).\n\n### Ear Seekers detected\n\n- Pell on western drawbridge winch called movement. Alphie went to gatehouse arch. Perception 16. Kella +6 confirmed: orc warband on foot, jogging, big one limping in front.\n- Marcus rolled Ear Seekers clock honestly: 47 on percentile, under threshold, orcs coming within hour. Source p.28 trigger.\n\n### Decision: hold Nightstone, fight first\n\n- Alphie's call: do not ride to caves with 405 HP orc warband at the party's back.\n- Drawbridge raised in 3 rounds by Pell and Maks at winches.\n- Archers placed: Sydiri+Alara on tower 2A, Tessa on 2B with crossbows.\n- Torem rigged keep plank bridge to be pulled. Hask and Kaelen took horses behind cover at stable.\n- Joren on inn roof. Dorrin and Alphie at western gate. Wren central then to tower 2A. Kella on trading post roof. Xolkin at base of 2A.\n\n### Wood elves spotted\n\n- Alphie rolled Perception **Nat 20** at gatehouse. Saw 8 wood elves of the Ardeep in north-east treeline, fanned in observation crescent, leader **Rond Arrowhome**, lieutenant beside him with horn.\n- Sydiri's three short blasts on Lord's Alliance horn. Rond's two-long-three-short answer. Elves committed.\n\n### Battle of Nightstone — round-by-round\n\n**Initiative:** Kella 21, Alara 18, Wren 16, Dorrin 16, Xolkin 14, Sydiri 14, Pell 13, Alphie 13, Gurrash 10, Norgra 9, Joren 9, Tessa 7, orcs 7, Maks 5.\n\n**Round 1:** Alara hit wading orc for 8. Wren dashed to 2A. Dorrin Bless on Sydiri/Alara/Tessa. Xolkin moved to base of 2A. Sydiri shot for 7. Pell hit for 9. Alphie moved to gatehouse arch, Fire Bolted wading orc for 8 (kill). Gurrash bellowed spear-circle order. Norgra cast Bless on Gurrash + 2 flankers (concentration). Joren climbed to inn roof. Tessa hit for 6. Maks hit for 5.\n\n**Round 2:** Kella shot Gurrash for 5 piercing (no Sneak Attack — no condition met). Alara crit Orc 4 for 16. Wren cast Faerie Fire on cluster (DC 13 DEX). **Marcus assigned Portent 4 to Gurrash's DEX save: 4 + 0 = fail.** Outlined Gurrash, Norgra, 2 flankers, Orc 6. Wren on concentration. Dorrin held Bless. Xolkin readied for wall crest. Sydiri shot Gurrash with advantage and Bless die 3: 24 hit, 8 damage. Pell shot Norgra: 17 hit, 9 damage; concentration 13 holds. **Alphie cast Magic Missile on Norgra: 12 force damage.** Concentration save DC 10. **Marcus assigned Portent 5 to Norgra's first concentration save: 5 + 2 = fail.** Orc Bless dropped. Gurrash failed climb (palisade tar-sealed, source auto-fail). Norgra cast Spiritual Weapon (2nd-level slot), spectral spear hit Sydiri for 8; Bless re-up on Gurrash. Joren shot Norgra: 21 hit, 8 damage; concentration 18 holds. **Wood elves arrived, first volley: ~50 HP across warband, 3 dead, 2 wounded.** Tessa hit Norgra for 6, concentration 11 holds. Maks hit Gurrash for 8.\n\n**Round 3:** Alphie ordered Norgra-then-Gurrash. **Kella killed Norgra** with Sneak Attack (Faerie Fire advantage condition met): 14 damage. Spiritual Weapon vanished. Alara crit Gurrash with advantage and Bless die 3: 16 damage. Wren maintained Faerie Fire and Vicious Mockery on Gurrash, 3 psychic. Dorrin held Bless and used bonus action Healing Word Sydiri (9 HP, full). Xolkin held position. Sydiri shot Gurrash: 24 hit, 7 damage. Pell shot Gurrash: 17 hit, 7 damage. **Alphie Fire Bolted Gurrash with advantage: 22 hit, 7 fire damage. Gurrash dead.** Rond called the press. Second elf volley: 2 more orcs dead, 3 wounded.\n\n**End of fight.** Source p.28 break condition met (>half lost without foothold). Survivors fled into hills. **Allied casualties: zero dead.** Sydiri took 8 damage, healed back to full. Battle: ~30 seconds combat time.\n\n### Negotiation with Rond Arrowhome\n\n- Rond across moat: *\"Nightstone. You're welcome.\"*\n- Alphie's request: rescue, no claim, no reward, only rescue. Children and wounded.\n- Persuasion DC 16. **Nat 20 + 3 = 23.**\n- Rond committed all 8 elves within the hour. Named the back way: 50-foot natural chimney from hilltop to area 7.\n\n### Ride to Dripping Caves\n\n- 16 combatants out, 5 watchers stayed at Nightstone (Pell, Maks, Tessa, Hask, Torem, Kaelen — count varies depending on whether Pell+Maks rode out with Xolkin's reformed column or stayed; ask Marcus to confirm scene by scene).\n- Roughly a mile north on High Road, ~10 minutes.\n- Alphie rolled **Nat 20 Perception** at cave approach. Saw old villager tracks, goblin tracks crossing later, two heavy drag marks, no active sentry, disturbed brush at chimney path, faint cooking smoke from south mouth (inside, not outside).\n\n### Cave mouth negotiation with Hark\n\n- Chimney team peeled off: Kella, Wren, Rond, 3 Ardeep scouts.\n- South mouth team: Alphie, Dorrin, Xolkin, Joren, Sydiri, Alara, 4 Ardeep scouts.\n- Alphie called Hark by name: cloud giants attack, Gum-Gum free, orcs dead in moat, Ardeep with us, terms offered.\n- Hark answered from cover (smart, refused to expose himself). Asked terms.\n- Alphie's offer: villagers all out south mouth in 10 min, goblins walk out alive north — *Counter:* Hark proposed goblins exit by **west stream tunnel** under safe passage, not north.\n- Persuasion **Nat 20 + 2 + Bless 3 = 25.**\n- Lieutenant in scrub relayed Rond's acceptance of Ardeep terms (no captives, no bones, no stolen child, no blade raised).\n- Morak's voice from inside: *\"IF THAT'S A ROANE OUT THERE, YOU TELL THAT GOBLIN RAT I'LL WALK OUT WHEN THE CHILDREN WALK OUT!\"*\n- First three out: older woman, boy of nine, halfling child.\n\n### Ogre problem — Giant language reveal\n\n- Marcus retroactively rendered ogre line *\"Why food walking?\"* in Giant. Alphie speaks Giant (Session 0 ruling). He understood it. Ogres did not know about the deal.\n- Alphie offered ogres six horses to stay in cave. Spoke Giant directly. Persuasion DC 12 against ogre INT 5, Bless still up.\n- **Nat 20.** Ogres accepted. *\"Horse better. Six horse. We wait.\"*\n\n### Extraction and horses\n\n- Villagers extracted in clusters. Morak walked out near middle, hammer in hand, child on hip.\n- Goblin clan exited by west stream tunnel under safe passage.\n- Six spare horses led to cave threshold and released into the dark. Not pretended to be nothing. Dorrin's line: *\"Those horses belonged to frightened folk. And frightened folk are worth more.\"*\n- Chimney team came down. Wren pale, Kella with blood on sleeve not hers.\n- Rond: *\"A costly mercy.\"* Kella: *\"Better than a cheap funeral.\"*\n\n### Return to Nightstone\n\n- Column: Sydiri+Morak front, Alara with children/wounded, Wren near frightened ones, Rond+Ardeep on ridgelines, Xolkin+Joren mounted flanks, Kella drifting between, Alphie+Dorrin rear.\n- Cave mouth stayed dark, no ogres emerged.\n- Dorrin and Alphie spoke quietly at the rear: *\"Those horses bought lives. Still hurts. It should.\"*\n- Morak reaching village: *\"Right. Let's get them home.\"*\n\n### At the gate\n\n- Sydiri's witness: *\"I witnessed the oath. Xolkin Alassandar kept it. Kella Darkhope kept terms. The villagers are home because the bargain held.\"* Dorrin added witness from Berronar.\n- Sydiri's ruling: *\"Then Nightstone will not arrest you today. But you are not welcome to stay. You leave by sundown.\"* Xolkin accepted.\n- Morak: *\"And if your report brings more Black Network boots here?\"* Xolkin: *\"Then you'll know they're coming.\"*\n- Xolkin to Kella: *\"You're not under arrest. You're not ordered. Ride with us if you choose.\"* Kella: *\"I'll speak with Roane first.\"*\n- Xolkin: *\"Then I'll wait at the south road until noon. After that, I ride.\"*\n- Rond to Sydiri: *\"Your horn will be answered if it calls for captives, children, or orcs. Not politics.\"*\n- Rond to Alphie: *\"Do not spend that horn cheaply.\"*\n- Rond + Ardeep departed.\n\n### The horse restitution\n\n- Alphie offered 500 gp to Morak as restitution for the six horses (4 draft + 2 riding, market 350 gp; 150 gp over to honour the working-animal cost to frightened folk).\n- Three documents written, signed, witnessed:\n  - **Nightstone restitution note:** 500 gp owed, 25 gp paid immediately, balance honoured through House Roane accounts/trade credit/replacement stock. Witnessed by Morak, Dorrin, Sydiri. Roane signet in wax.\n  - **Letter to House Roane:** request for replacement horses, timber, grain, nails, canvas, coin relief. Obligation language, not charity language.\n  - **Letter to Daggerford contacts:** request for relief column under merchant escort.\n- Morak: *\"That's the right number.\"* Pocketed the note.\n- Kella, watching: *\"So this is what your house does?\"* Genuine question, not mocking. **The conversation that opens from this question is the next thing on the table.**\n\n### Out-of-character table beat (last OOC)\n\n- Talia and Ben raised the front-line problem: Dorrin keeps walking forward because nobody else can. Both said yes to a fighter/paladin/barbarian if a real fourth player turns up.\n- Talia raised the Wren/Kella relationship and asked whether Kella becomes a travelling NPC ally or stays recurring.\n- Ben flagged that morally-grey-NPC-becomes-PC is a betrayal-arc trap; doesn't want it on rails.\n- Marcus offered: post on Dave's corkboard for a fourth player; three weeks to find someone, one trial session, then commit.\n- Marcus also flagged that Joren as a travelling NPC squire is the cheapest add — light combat presence, mentor relationship for Alphie — and that Rond won't come.\n\n### The \"ripped off\" question\n\n- Josh asked whether the 500 gp was fair given the lives saved.\n- Answer given: the 500 gp wasn't a fee for saving lives; it was restitution for horses. The lives can't be paid in coin from a 130-person farming village. The actual reward is reputation in the North, House Roane standing, Lord's Alliance regard, the Ardeep horn relationship, Nightstone gratitude (bed/board/information), and downstream magic items at later chapters.\n- Suggested move: ask Morak quietly to remember three names — Alphie Roane, Wren, Dorrin Stonebrook — when travellers ask who rode in. *That's how a noble collects payment for things he cannot be seen collecting payment for.*\n- Josh has not yet executed this in fiction. **It's an open thread.**\n\n---\n\n## Resources at the pause point\n\n### Spell economy\n\n| Caster | Slots used today | Current state |\n|---|---|---|\n| Alphie | 2× 1st (Mage Armor, Magic Missile) | 2/4 first-level, 2/2 second-level. Mage Armor up ~6h. Both Portent dice spent — re-roll on next long rest. |\n| Wren | 2× 1st (Sleep, Faerie Fire) | 2/4 first-level, 2/2 second-level. Bardic Inspiration 3/3. |\n| Dorrin | 4× 1st (Cure Wounds, 2× Bless, Healing Word) + 1× 2nd (Aid) | 0/4 first-level, 1/2 second-level. Channel Divinity unspent. |\n\n**Long rest tonight in Nightstone restores everything. Marcus's call: the night's rest is uninterrupted unless plot intervenes.**\n\n### Inventory\n\n- **Party fund:** 45 gp + 2× 100 gp gems from Morak's chest. **20 gp remaining of the original 25 starting** (Alphie put down 25 gp earnest money on the restitution — coming out of Roane fund, but tracked).\n- **Restitution debt:** 475 gp owed to Nightstone village under House Roane signet.\n- **Morak's safekeeping returning to him:** dwarf-sized chain mail, dwarven helm, identified Potion of Heroism. **Dorrin to hand back at next quiet moment.**\n- **Alphie:** spellbook, scholar's pack, fine clothes, signet ring, scroll of pedigree, dagger (recovered), Find Familiar components 10 gp.\n- **Wren:** leather armour, rapier, dagger, entertainer's pack, lute, viol, costume, lantern, 15 gp.\n- **Dorrin:** chain mail, shield, warhammer, light crossbow, 20 bolts, priest's pack, holy symbol.\n- **Kella:** hand crossbow, short blade, boot knife, winged snake, clothes.\n\n### Horses\n\n- **Sace + cart:** at original cold camp, not yet retrieved. **Loose end.**\n- **Four primary mounts:** Alphie's bay riding horse, Wren's smaller riding horse, Kella's dark riding horse, Dorrin's draft horse. All in Nightstone.\n- **Six spare horses:** **gone** — fed to ogres in the cave bargain.\n- **Other Nightstone horses:** ~4 horses still at the stable, source of those Alphie/Wren/Kella rode out on. Ownership being sorted by Morak.\n\n---\n\n## Open threads at the pause\n\n1. **Kella waiting at the well.** She wants a private word. Wren wants it as a party conversation. **Most immediate next scene.**\n2. **Ben and Talia at the table** — discussing recruitment options OOC. Marcus offered: notice on Dave's corkboard for a fourth front-line player; Joren as cheap NPC squire option; Kella's status to be decided by the players together.\n3. **Lady Velrosa Nandar's burial.** Sydiri will want to do this properly tomorrow at first light. Ceremony beat available.\n4. **The Roane cousin.** Original campaign hook — Alphie was riding to Nightstone to find a silent trade contact. Not yet located. Morak may know who it is. Loose end.\n5. **Three names ask.** Alphie has not yet asked Morak to remember three names to passing travellers. Quiet noble move available.\n6. **Find Familiar.** Ink not yet summoned. 1-hour ritual, 10 gp components, available any quiet hour in Nightstone tonight.\n7. **Sace and the cart at the cold camp.** Need retrieving.\n8. **Letters:** Roane house letter and Daggerford relief letter need to go out. Need a courier — Daggerford is roughly a day's ride. Morak may have someone.\n9. **Goblin loose ends in Nightstone:** Beedo and Vark still in the temple belfry as of this morning, no one has cleared them. Other scattered goblin looters may still be around.\n10. **Xolkin's noon departure.** He is at the south road. If Kella decides to ride with him, that resolves cleanly. If she stays, he leaves alone with his five.\n11. **Mage Armor expires** in ~6 hours. Recast before sundown if Alphie wants it for the night.\n\n---\n\n## Relationships and moral state\n\n- **Alphie & Wren:** Wren has watched Alphie pass every moral test of the morning. She is going to remember the road negotiation, the Vicious Mockery line about tar, and the horse-restitution moment. Strong trust.\n- **Alphie & Dorrin:** Settled moral anchor. Dorrin stood with Alphie in the horses-for-ogres bargain without absolution and without rebuke. *\"Still hurts. It should.\"* That's the strongest endorsement Dorrin offers anyone.\n- **Alphie & Kella:** Mutual respect. Weapons returned. She publicly vouched for him to Xolkin. She's just witnessed him write a 500 gp restitution note — something genuinely outside her worldview. The next conversation is hers to ask for.\n- **Alphie & Xolkin:** Working alliance under public oath, now formally concluded with the contract endpoint reached. Xolkin honoured everything. Sydiri did not arrest him. Departing by noon.\n- **Alphie & Sydiri:** Sergeant respects Alphie's command voice. She rode with him. She named Daggerford's magistrate as her authority. Strong working relationship. Sydiri will be Nightstone's de facto leader for the next weeks until a Nandar successor is named.\n- **Alphie & Morak:** Restitution note in his pocket. Morak is realistic, dwarf-honest, and grateful in a way that doesn't need to be said. He'll hold Alphie to the 475 gp debt and respect him for owing it.\n- **Alphie & Rond Arrowhome:** Horn relationship intact. *\"Do not spend that horn cheaply.\"* Permanent diplomatic line to the Ardeep — most significant strategic outcome of the morning.\n- **Xolkin & Sydiri:** Sydiri has Daggerford magistrate authority over him. Xolkin has given his word in front of Berronar. Bound publicly. He's leaving today.\n- **Xolkin & Kella:** Source-correct, he's in love with her. He offered her a ride out. She deferred to speak with Alphie first. The choice is hers.\n- **Wren & Kella:** Wren has been watching Kella the whole time. They were just in the chimney route together, and Kella came out with blood on her sleeve that wasn't hers and didn't explain it. There's a relationship developing that Talia wants to keep playing.\n\n---\n\n## Source-vs-table canon reminders\n\n- Nandar Keep area 14a: 4 surviving human guards (Sydiri, Alara, Torem, Kaelen) — all alive at pause.\n- Hark negotiable per source — confirmed in play.\n- Ogres allied with Hark, not commanded — confirmed in play; ogres took the horse bargain, did not pursue.\n- Seven Snakes: Xolkin + 6 bandits, source-correct.\n- Wren's spells from her sheet, not the Tactical Dossier.\n- Bell silent; not re-rung.\n- Mysterious hooded observer is non-canon, scrubbed.\n\n---\n\n## Character voice notes for the next DM\n\n- **Sydiri Haunlar:** hoarse from grief, sergeant-bearing, mourning band on left arm. Speaks plainly. Names magistrates. Has decided to lead Nightstone through the rebuild.\n- **Alara Winterspell:** 19, frightened but won't break, nods three times when answering an order. Better at horses than fighting.\n- **Torem Breck:** 41, broken right arm, dry humour. *\"I'll mind the gate, Roane. One-armed, one-eyed if you like.\"*\n- **Kaelen Zam:** 18 squire, head wound healed but still pale. Loves horses.\n- **Rond Arrowhome:** tall, white streak in dark hair, hand-on-heart for sworn statements. Brother died wearing the ear Gurrash carried. Departed for Ardeep.\n- **Xolkin:** half-elf, silver streak at one temple, twin scimitars. Half-elven oath gesture (right hand over heart) is his real word. Departing by noon.\n- **Morak Ur'gray:** dwarf innkeeper, hammer, beard, \"Gods below, lad. You brought half a war.\" Realistic, grateful, dwarf-honest. Holds the restitution note in his pocket.\n- **Kella Darkhope:** dry, observant, professional, recalibrating. Has just asked a genuine question about House Roane. Waiting at the well.\n\n---\n\n## Final note for the next DM\n\nThe next thing to do is voice the **Kella conversation at the well**, with Wren and Dorrin present at Wren's request. After that, the rest of the day is recovery: supper in the mud, roof checks, watches before grief, Lady Velrosa's burial at first light, Find Familiar ritual at a quiet hour, Sace and the cart retrieved, letters dispatched, three-names ask to Morak.\n\nThen the night's long rest in Nightstone, and tomorrow opens Chapter 2 of Storm King's Thunder.\n\n*Good luck at the well.*"}, {"id": "GemeniHandover27042026_md", "title": "Gemenihandover27042026", "path": "GemeniHandover27042026.md", "type": "md", "sizeKB": 6.9, "updated": "2026-04-27T11:48", "description": "Bookmark confirmed. This point represents a critical pivot moment, moving the campaign from the defensive \"cleanup\" phase within Nightstone ", "content": "Bookmark confirmed. This point represents a critical pivot moment, moving the campaign from the defensive \"cleanup\" phase within Nightstone to the proactive \"rescue\" phase at the Dripping Caves.\n\nHere is the complete handover document summarizing all activity up to the current moment, where the coalition of 16 riders has just exited Nightstone.\n\n---\n\n## CAMPAIGN HANDOVER: Nightstone to the Ardeep\n\n**Current Location:** Just outside the main northern drawbridge of Nightstone, heading north on the high road towards the Ardeep Forest and the hills where the Dripping Caves lie. (Captured in generated image: image_0.png)\n\n**Current Objective:** Execute a dual stealth-extraction and frontal-assault mission on the Dripping Caves to rescue the survivors of the Cloud Giant attack (the Nightstone villagers).\n\n**Time:** Early afternoon. (Approximately 7 hours remaining on Alphie’s *Mage Armor*).\n\n---\n\n### PART 1: EXECUTIVE SUMMARY\n\nNightstone was attacked by cloud giants, who bombed the settlement with rocks and stole the village’s defensive landmark (the obsidian nightstone). Most villagers fled, but many were captured by goblins that moved in to plunder the ruins.\n\nThe adventuring party arrived post-attack and systematically cleared the village of goblins. During this process, they stabilized critical situations: they rescued surviving guards and a trapped Zhentarim spy (Kella) in the Inn.\n\nSimultaneously, two rival mercenary groups arrived: rival orcs from the hills and the Seven Snakes Zhentarim, led by Xolkin Alassandar. Through a combination of diplomacy, strength, and the common threat of the orc raid, the party forged an unlikely, temporary alliance between the Zhents, the surviving Nightstone militia, and wood elf scouts who had arrived from the Ardeep Forest.\n\nIn the final preparation phase, the party executed a dramatic cavalry blitz, killing the final worg sentries that had been blockading the main square, thereby freeing the main drawbridge for the entire coalition. A critical ten-minute preparation window (Operation: Lawful Requisition) was spent gathering specific gear, allocating supplies, and casting protective magic before riding out.\n\n---\n\n### PART 2: THE COALITION (The 16 Riders)\n\nA tense, multi-faction alliance of necessity, currently riding in formation away from Nightstone. (See current stats in image_0.png prompt).\n\n**Total Forces:** 16 unique named combatants.\n\n**1. The Party (The Core):**\n* **Alphie J. Roane (Divination Wizard 2):** Current Plan: Holding two powerful **Portent** dice (19, 3). No 1st-level slots (all spent during watch/Mage Armor/Worg fight). *Mage Armor* active. Lead \"Shape of the Plan.\"\n* **Dorrin Stonebrook (Life Cleric 2):** Holding the **Potion of Heroism** (from Morak's chest). No slots remaining. *Critical Task:* He will use his Channel Divinity (**Preserve Life** - 10 HP pool) during the next short rest/crisis to restore the group.\n* **Wren (Bard 2):** Current BI: 3/3. Holds the single **Potion of Healing** (from Agganor's). Part of the Chimney Team.\n\n**2. The Seven Snakes (Zhentarim):** (Oath-bound to extraction and safety, *if* the plan holds).\n* **Kella Darkhope (Spy CR 1):** The core scout. Part of the Chimney Team. Crucial note: she speaks Goblin fluently. Highly competent with a shortsword.\n* **Xolkin Alassandar (Bandit Captain CR 2):** Group leader and powerful melee reserve. Intends to drink the Heroism potion only when an ogre appears. Possesses his own Potion of Invulnerability.\n* **Joren (Bandit CR 1/8):** Standard guard. Moving to South Mouth with Xolkin.\n\n**3. Nightstone Militia (The Guides):**\n* **Sydiri Haunlar (Sergeant):** Group leader for locals. Healed to full HP. Provided intelligence about village medical supplies.\n* **Alara Winterspell (Guard CR 1/8):** Crossbow support.\n\n**4. Ardeep Forest Elves (The Specialists):**\n* **Rond Arrowhome (Scout CR 1/2):** Wood elf scout leader. Crucial Note: He knows the hidden chimney entrance to the caves. Leading the stealth team.\n* **Ardeep Scouts (7 total):** Lithe, stealthy, ranged (longbow) support. Rond's team. Three scouts are in the Chimney team; four are moving to the South Mouth entrance as ranged support.\n\n---\n\n### PART 3: KEY INTELLIGENCE & INVENTORY\n\n**Critical Information (Nightstone Status):**\n* **Captured Goblins:** Beedo, Vark, and Gum-Gum were captured earlier. Vark and Beedo have already revealed critical intelligence about the cave layout. All three are currently bound and neutralized in the keep courtyard.\n* **Loot Secured:** Morak’s chest is with the party. It contains: Dwarven Chain Mail (+1), Dwarven Helm (+1 AC), 45 gp, and two 100 gp gems. (Currently carried by Dorrin's draft horse).\n* **Morak's Gift:** Potion of Heroism, explicitly given by Morak to Dorrin.\n* **The Trading Post (Area 9):** Was stabilized; the goblin Jilk was captured and bound, left at the gatehouse. All adventuring gear worth 10gp or less (Ropes, grapples, crowbars, chalk, caltrops, etc.) was requisitioned and distributed.\n* **Agganor’s House:** Cleared; Kella found a Potion of Healing, midwife supplies, and a medical kit. The Asmodeus holy symbol was identified but left untouched. Alphie J. Roane’s written note/IOU was left on the table.\n* **Summerhawk Residence:** An Ardeep scout (Passive Perception 19) located a hidden herbalism kit and one vial of antitoxin. These were taken and distributed.\n\n---\n\n### PART 4: THE OPERATIONAL PLAN (Active)\n\nThe coalition is executing a two-pronged \"Loud/Quiet\" assault strategy, designed to keep the cave defenders off-balance. The groups are *not* together for the assault, but are working in concert.\n\n**Group 1: \"The Chimney Team\" (The Quiet Extraction)**\n* **Members (6):** Rond Arrowhome (Leader), Kella Darkhope (Scout/Translator), Wren (Magic/BI), 3 Ardeep Scouts.\n* **Gear:** Supplied with optimal stealth tools: all ropes, grappling hooks, caltrops, chalk, and the single Potion of Healing.\n* **Mission:** Rond leads this group to a secret \"chimney\" ventilation shaft high on the hill. Kella infiltrates and speaks to survivors in goblin if needed. They are executing stealth extraction of as many villagers as possible without triggering an alarm.\n\n**Group 2: \"The South Mouth Team\" (The Loud Assault)**\n* **Members (10):** Alphie J. Roane (Plan/Portent), Dorrin Stonebrook (Life/Healing pool/Heroism), Xolkin Alassandar (Melee Reserve/Invulnerability), Sydiri Haunlar (Militia), Joren, Alara Winterspell, 4 Ardeep Scouts.\n* **Gear:** Suppled with loud tools: all oil, crowbars, hooded lanterns, and ball bearings.\n* **Mission:** Move openly and aggressively towards the main south cave mouth, which is known to be the largest area and most likely location of the goblin leadership and **two ogres**. They must make maximum noise, triggering an alarm to draw defenders (especially the ogres) *towards* them, thereby leaving the Chimney Team clear. They are prepared for a brutal assault on the entrance, leveraging Dorrin's Channel Divinity and Xolkin’s melee power to hold the ground."}, {"id": "REPOSITORY_FILE_TREE_md", "title": "Repository File Tree", "path": "REPOSITORY_FILE_TREE.md", "type": "md", "sizeKB": 3.8, "updated": "2026-04-27T11:50", "description": "📁 Alfie's D&D Campaign Repository — Complete File Tree", "content": "# 📁 Alfie's D&D Campaign Repository — Complete File Tree\n\n**Last Updated:** April 27, 2026\n**Campaign:** Storm King's Thunder — Dubbo Table\n\n---\n\n## 🗂️ Main Repository Location\n\n```\nc:\\Users\\joshua.parris\\OneDrive - Dubbo Christian School\\Documents\\03_Projects\\__Alfie Dnd\\\n```\n\n---\n\n## 📂 Root Folder Contents\n\n| File/Folder | Type | Description |\n|---|---|---|\n| `index.html` | 🌐 | **HTML Website** — Browse all campaign files |\n| `Alphie_Complete_Inventory.md` | 📋 | **Complete Inventory** — Detailed item list |\n| `GemeniHandover.md` | 📄 | Campaign handover document |\n\n---\n\n## 📂 Downloaded Archive (Source)\n\n```\nc:\\Users\\joshua.parris\\Downloads\\Alphie Wizard - Storm kings -20260427T114209Z-3-001\\Alphie Wizard - Storm kings\\\n```\n\n### Root Level Files\n\n| File | Type | Description |\n|---|---|---|\n| `_Alfie item notes.docx` | 📝 | Item notes from gameplay |\n| `__Storm King_s Thunder (1-10).pdf` | 📖 | Core rulebook |\n| `_Storm_Ki
